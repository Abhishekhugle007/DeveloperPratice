{% extends "base.html" %}

{% block title %}{{ heading }} - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <h2>{{ heading }}</h2>

    {% if errors %}
        <div class="alert alert-danger" role="alert">
            <ul class="mb-0">
                {% for error in errors.values() %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form action="{{ form_action }}" method="post" class="mt-3">
        <div class="mb-3">
            <label class="form-label" for="title">Title</label>
            <input class="form-control" type="text" id="title" name="title"
                   value="{{ form_data.title }}" maxlength="120" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="content">Note</label>
            <textarea class="form-control" id="content" name="content" rows="10"
                      maxlength="10000">{{ form_data.content }}</textarea>
        </div>

        <button class="btn btn-primary" type="submit">{{ button_text }}</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('notes.list_notes') }}">Cancel</a>
    </form>
</div>
{% endblock %}
