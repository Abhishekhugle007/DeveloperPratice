{% extends "base.html" %}

{% block title %}{{ heading }} - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <h2>{{ heading }}</h2>

    {% if errors %}
        <div class="alert alert-danger" role="alert">
            <ul class="mb-0">
                {% for error in errors.values() %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form action="{{ form_action }}" method="post" class="mt-3">
        <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" type="text" id="name" name="name"
                   value="{{ form_data.name }}" minlength="2" maxlength="80" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email"
                   value="{{ form_data.email }}" maxlength="254" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="course">Course</label>
            <input class="form-control" type="text" id="course" name="course"
                   value="{{ form_data.course }}" minlength="2" maxlength="80" required>
        </div>

        <button class="btn btn-primary" type="submit">{{ button_text }}</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('students.list_students') }}">Cancel</a>
    </form>
</div>
{% endblock %}
