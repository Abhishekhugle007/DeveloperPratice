<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDs and Classes</title>
    <style type="text/css">
        .newClass{
            color:yellow;
        }
        #p3,#p4
        {
            color:blue;
        }
        
    </style>
</head>
<body>
    <p id="p1"class="newclass">This is paragraph content </p>
    <p id ="p2"class="newclass">This is 2nd paragraph</p>
    <p id ="p3"class="newclass">This is 3rd paragraph</p>
    <p id="p4"class="newclass">This is 4th paragraph</p>
    <p id="p5"class="newclass">This is 5 th paragraph</p>
</body>
</html>
