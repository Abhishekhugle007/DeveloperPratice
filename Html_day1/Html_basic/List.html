<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>


    <ul type="disc">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    
    <ol>
        <li>Item 1</li>

        <li>
            Item 2

           
            <ol type="a">
                <li>Sub list item 1</li>
                <ol type="i">
                  <li>Sub list item 2</li>
                </ol>
                

                <ol type="I">
                    <li>Another item 1</li>
                    <li>Another item 2</li>
                </ol>
            </ol>
        </li>

        <li>Item 3</li>
    </ol>

</body>
</html>
