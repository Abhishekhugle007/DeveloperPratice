<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;}

        input, button {
            padding: 10px;
            margin: 5px 0;}
        input {
            width: 100%;
            box-sizing: border-box;
        }
        button {
            cursor: pointer;
        }
        #messages {
            border: 1px solid #ccc;
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            margin: 15px 0;
        }
        #status {
            min-height: 1em;
        }
        #presence {
            min-height: 1em;
            color: #555;
        }
        .chat-message {
            margin: 6px 0;
            overflow-wrap: anywhere;
        }
        .delivery-status {
            margin-left: 8px;
            color: #d82d2d;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <h2>Private Chat</h2>

    <label for="userId">Your User ID</label>
    <input id="userId" placeholder="Enter your ID">

    <button id="joinBtn">Join Chat</button>
    <p id="status" role="status"></p>

    <hr>

    <label for="receiverId">Recipient ID(s)</label>
    <input id="receiverId" placeholder="user2 or user2,user3">
    <p id="presence" role="status" aria-live="polite"></p>

    <div id="messages"></div>

    <input id="messageInput" placeholder="Type a message..." disabled>
    <button id="sendBtn" disabled>Send Message</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const userInput = document.getElementById("userId");
        const receiverInput = document.getElementById("receiverId");
        const messageInput = document.getElementById("messageInput");
        const messages = document.getElementById("messages");
        const status = document.getElementById("status");
        const presence = document.getElementById("presence");
        const joinBtn = document.getElementById("joinBtn");
        const sendBtn = document.getElementById("sendBtn");
        const SESSION_STORAGE_KEY = "socketChatSession";

        let userId = "";
        let joined = false;
        let joining = false;
        let currentReceiver = "";
        let historyCursor = null;
        let hasOlderMessages = false;
        let historyLoading = false;
        let historyRequestId = 0;
        const renderedMessageIds = new Set();
        const renderedDeliveryStatuses = new Map();
        const onlineUserIds = new Set();

        try {
            const savedSession = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || "null");
            if (
                savedSession &&
                typeof savedSession.userId === "string" &&
                savedSession.userId.trim() &&
                savedSession.userId.trim().length <= 64
            ) {
                userId = savedSession.userId.trim();
                userInput.value = userId;
                if (typeof savedSession.recipientInput === "string") {
                    receiverInput.value = savedSession.recipientInput;
                }
            }
        } catch (error) {
            console.error("Could not restore the saved chat session:", error);
            showStatus("Could not restore your saved chat session.");
        }

        function saveSession() {
            try {
                localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
                    userId,
                    recipientInput: receiverInput.value
                }));
            } catch (error) {
                console.error("Could not save the chat session:", error);
                showStatus("Could not save your chat session in this browser.");
            }
        }

        function showStatus(text) {
            status.textContent = text;
        }

        function updatePresenceDisplay() {
            const recipients = getRecipients();
            if (!joined || !socket.connected) {
                presence.textContent = recipients.length
                    ? "Join the chat to see presence."
                    : "";
                return;
            }
            if (recipients.length !== 1) {
                presence.textContent = recipients.length > 1
                    ? "Presence is shown for one recipient at a time."
                    : "";
                return;
            }
            const recipient = recipients[0];
            presence.textContent = `${recipient} is ${onlineUserIds.has(recipient) ? "online" : "offline"}.`;
        }

        function updateDeliveryStatus(messageId, messageStatus) {
            if (!messageId) return;
            const id = String(messageId);
            const normalizedStatus = messageStatus === "delivered" ? "delivered" : "sent";
            renderedDeliveryStatuses.set(id, normalizedStatus);
            const deliveryElement = document.querySelector(
                `[data-message-id="${CSS.escape(id)}"] .delivery-status`
            );
            if (deliveryElement) {
                deliveryElement.textContent = normalizedStatus === "delivered"
                    ? "Delivered"
                    : "Sent";
                deliveryElement.setAttribute("aria-label", normalizedStatus);
            }
        }

        function setControls() {
            joinBtn.disabled = !socket.connected || joining;
            joinBtn.textContent = joined ? "Switch User" : joining ? "Joining..." : "Join Chat";
            userInput.disabled = joined || joining;
            messageInput.disabled = !joined;
            sendBtn.disabled = !joined;
        }

        function getRecipients() {
            return [...new Set(
                receiverInput.value.split(",")
                    .map(id => id.trim())
                    .filter(Boolean)
            )];
        }

        function showMessage(msg, prepend = false, senderLabel = null) {
            const id = msg.id || msg._id;
            if (id && renderedMessageIds.has(String(id))) return;

            const div = document.createElement("div");
            div.className = "chat-message";
            if (id) {
                div.dataset.messageId = String(id);
                renderedMessageIds.add(String(id));
            }
            const content = document.createElement("span");
            content.textContent = `${senderLabel || (msg.from === userId ? "You" : msg.from)}: ${msg.message}`;
            div.appendChild(content);
            if (msg.from === userId) {
                const delivery = document.createElement("span");
                delivery.className = "delivery-status";
                delivery.setAttribute("aria-label", "sent");
                div.appendChild(delivery);
            }
            if (prepend) {
                    messages.prepend(div);
            } else {
                    messages.appendChild(div);
            }
            if (msg.from === userId) {
                updateDeliveryStatus(
                    id,
                    renderedDeliveryStatuses.get(String(id)) || msg.status || "sent"
                );
            }
        }

        function loadMessages(loadOlder = false) {
            const recipients = getRecipients();

            if (!joined || recipients.length !== 1) {
                    historyRequestId += 1;
                    currentReceiver = "";
                    historyCursor = null;
                    hasOlderMessages = false;
                    historyLoading = false;
                    messages.replaceChildren();
                    renderedMessageIds.clear();
                    renderedDeliveryStatuses.clear();
                    return;
            }

            const receiver = recipients[0];

            if (loadOlder) {
                    if (historyLoading || !hasOlderMessages || !historyCursor) return;
            } else {
                    if (receiver === currentReceiver) return;
                    currentReceiver = receiver;
                    historyRequestId += 1;
                    historyCursor = null;
                    hasOlderMessages = false;
                    messages.replaceChildren();
                    renderedMessageIds.clear();
                    renderedDeliveryStatuses.clear();
            }

            const requestId = historyRequestId;
            const oldHeight = messages.scrollHeight;
            historyLoading = true;
            const request = { to: receiver };
            if (loadOlder) request.before = historyCursor;

            socket.timeout(10000).emit("fetchMessages", request, (timeoutError, response) => {
                    if (requestId !== historyRequestId || receiver !== currentReceiver) return;
                    historyLoading = false;

                    if (timeoutError || !response?.ok) {
                        showStatus(response?.error || "Could not load chat history.");
                        return;
                    }

                    const batch = response.messages || [];
                    (loadOlder ? batch.slice().reverse() : batch)
                        .forEach(msg => showMessage(msg, loadOlder));
                    historyCursor = response.nextCursor || null;
                    hasOlderMessages = Boolean(response.hasMore);

                    if (!batch.length && !loadOlder) {
                        const notice = document.createElement("div");
                        notice.textContent = `No previous messages with ${receiver}.`;
                        messages.appendChild(notice);
                    }

                    if (loadOlder) {
                        messages.scrollTop = messages.scrollHeight - oldHeight;
                    } else {
                        messages.scrollTop = messages.scrollHeight;
                        showStatus(`Chat with ${receiver}`);
                        updatePresenceDisplay();
                    }
            });
        }

        function joinCurrentUser() {
            if (!userId || !socket.connected || joined || joining) return;

            joining = true;
            setControls();
            showStatus("Joining chat...");
            socket.timeout(10000).emit("join", userId, (timeoutError, response) => {
                    joining = false;
                    if (timeoutError || !response?.ok) {
                        joined = false;
                        setControls();
                        showStatus(response?.error || "Could not join chat.");
                        return;
                    }

                    joined = true;
                    setControls();
                    saveSession();
                    showStatus(`Joined as ${userId}`);
                    updatePresenceDisplay();
                    loadMessages();
            });
        }

        joinBtn.addEventListener("click", () => {
            if (joined) {
                joinBtn.disabled = true;
                showStatus("Leaving current chat...");
                socket.timeout(10000).emit("leave", (timeoutError, response) => {
                    if (timeoutError || !response?.ok) {
                        setControls();
                        showStatus(response?.error || "Could not leave the current chat.");
                        return;
                    }

                    joined = false;
                    joining = false;
                    userId = "";
                    currentReceiver = "";
                    historyRequestId += 1;
                    historyCursor = null;
                    hasOlderMessages = false;
                    historyLoading = false;
                    renderedMessageIds.clear();
                    renderedDeliveryStatuses.clear();
                    messages.replaceChildren();
                    userInput.value = "";
                    saveSession();
                    setControls();
                    showStatus("Enter your user ID to join another chat.");
                    updatePresenceDisplay();
                    userInput.focus();
                });
                return;
            }
            userId = userInput.value.trim();
            if (!userId || userId.length > 64) {
                    return showStatus("Enter a valid user ID (maximum 64 characters).");
            }
            joinCurrentUser();
        });
        sendBtn.addEventListener("click", () => {
            const recipients = getRecipients();
            const message = messageInput.value.trim();

            if (!joined) {
                return showStatus("Join the chat first.");
            }
            if (
                !recipients.length ||
                recipients.length > 50 ||
                recipients.includes(userId)
            ) {
                return showStatus("Enter valid recipient IDs.");
            }

            if (!message || message.length > 2000) {
                return showStatus("Message must be 1–2000 characters.");
            }

            sendBtn.disabled = true;
            socket.timeout(10000).emit("privateMessage", { to: recipients, message }, (timeoutError, response) => {
                sendBtn.disabled = !joined;
                if (timeoutError || !response?.ok) {
                    return showStatus(response?.error || "Message could not be sent.");
                }

                const sentMessage = response.messages.find(
                    msg => msg.to === currentReceiver
                );

                if (sentMessage) {
                    showMessage(sentMessage);
                    messages.scrollTop = messages.scrollHeight;
                } else if (recipients.length > 1) {
                    response.messages.forEach(msg => {
                        showMessage(msg, false, `You to ${msg.to}`);
                    });
                    messages.scrollTop = messages.scrollHeight;
                }

                messageInput.value = "";
                showStatus("Message sent successfully.");
            });
        });

        messageInput.addEventListener("keydown", event => {
            if (event.key === "Enter") sendBtn.click();
        });

        receiverInput.addEventListener("input", () => {
            saveSession();
            updatePresenceDisplay();
            loadMessages();
        });
        messages.addEventListener("scroll", () => {
            if (messages.scrollTop <= 40) loadMessages(true);
        });
        socket.on("privateMessage", msg => {
            if (joined && msg.to === userId && msg.id) {
                socket.emit("messageDelivered", msg.id);
            }
            if (joined && msg.to === userId && msg.from === currentReceiver) {
                showMessage(msg);
                messages.scrollTop = messages.scrollHeight;
            }
        });
        socket.on("presenceSnapshot", data => {
            onlineUserIds.clear();
            (data?.users || []).forEach(id => onlineUserIds.add(id));
            updatePresenceDisplay();
        });
        socket.on("userPresence", data => {
            if (!data || typeof data.userId !== "string") return;
            if (data.online) {
                onlineUserIds.add(data.userId);
            } else {
                onlineUserIds.delete(data.userId);
            }
            updatePresenceDisplay();
        });
        socket.on("messageStatus", data => {
            if (
                data?.status === "delivered" &&
                data.from === userId &&
                (data.to === currentReceiver || getRecipients().includes(data.to))
            ) {
                updateDeliveryStatus(data.id, data.status);
            }
        });
        socket.on("connect", () => {
            onlineUserIds.clear();
            if (userId) {
                joined = false;
                currentReceiver = "";
                historyRequestId += 1;
                historyCursor = null;
                hasOlderMessages = false;
                historyLoading = false;
                joinCurrentUser();
            } else {
                showStatus("Connected. Join the chat to start messaging.");
                setControls();
                updatePresenceDisplay();
            }
        });

        socket.on("disconnect", () => {
            onlineUserIds.clear();
            updatePresenceDisplay();
            joined = false;
            currentReceiver = "";
            historyRequestId += 1;
            historyCursor = null;
            hasOlderMessages = false;
            historyLoading = false;
            setControls();
            showStatus("Disconnected. Please reconnect.");
        });

        setControls();
    </script>
</body>
</html>
