
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-to-One Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
        }

        input {
            box-sizing: border-box;
            width: 100%;
        }

        button {
            cursor: pointer;
        }

        #messages {
            border: 1px solid #ccc;
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <h2>One-to-One Private Chat</h2>

    <label for="userId">Your User ID</label>
    <input id="userId" placeholder="e.g. user1">

    <button id="joinBtn">Join Chat</button>

    <hr>

    <label for="receiverId">Receiver User ID</label>
    <input id="receiverId" placeholder="e.g. user2">

    <div id="messages"></div>

    <input id="messageInput" placeholder="Type your message...">
    <button id="sendBtn">Send Message</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const userIdInput = document.getElementById("userId");
        const receiverInput = document.getElementById("receiverId");
        const messageInput = document.getElementById("messageInput");
        const messages = document.getElementById("messages");
        const joinBtn = document.getElementById("joinBtn");
        const sendBtn = document.getElementById("sendBtn");

        let joined = false;
        let currentUserId = "";

        function setControlsState() {
            sendBtn.disabled = !joined;
        }

        function showMessage(text) {
            const div = document.createElement("div");
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        joinBtn.onclick = () => {
            const userId = userIdInput.value.trim();

            if (!userId) {
                alert("Enter your User ID");
                return;
            }

            currentUserId = userId;
            socket.emit("join", userId);
            joined = true;
            userIdInput.disabled = true;
            setControlsState();

            showMessage("You joined as " + userId);
        };

        sendBtn.onclick = () => {
            const to = receiverInput.value.trim();
            const message = messageInput.value.trim();

            if (!joined) {
                alert("Join the chat first");
                return;
            }

            if (!to || !message) {
                alert("Enter receiver ID and message");
                return;
            }

            socket.emit("privateMessage", { to, from: currentUserId, message });

            showMessage("You to " + to + ": " + message);
            messageInput.value = "";
        };

        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                sendBtn.click();
            }
        });

        socket.on("privateMessage", (data) => {
            const sender = data && data.from ? data.from : "Someone";
            showMessage(sender + ": " + data.message);
        });

        socket.on("connect", () => {
            joined = false;
            currentUserId = "";
            userIdInput.disabled = false;
            setControlsState();
        });

        setControlsState();
    </script>
</body>
</html>
