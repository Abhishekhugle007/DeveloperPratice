<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .signup-container {
            background-color: #f39c12;
            padding: 19px;
            width:500px;
            margin: auto;
            margin-top: 50px;
            border-radius: 4px;
        }
        .signup-container h2 {
            text-align: left;
        }
        .signup-form {
            background-color: #34495e;
            padding: 20px;
            border-radius: 4px;
        }
        .signup-form label {
            display: block;
            align-content: reverse;
            margin-bottom: 3px;
            color: #ffeb3b;
        }
        .signup-form input, .signup-form select {
            width: calc(90% - 15px);
            padding: 17px;
            margin-bottom: 7px;
            border: none;
            border-radius: 2px;
        }
        .signup-form input[type="radio"] {
            width:100px;
        }
        .signup-form .terms {
            display: flex;
            align-items: left;
        }
        .signup-form .terms input {
            width: auto;
            margin-right: 10px;
        }
        .signup-form .buttons {
            text-align: center;
        }
        .signup-form .buttons button {
            padding: 7px 11px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
        }
        .signup-form .buttons button.submit {
            background-color: #27ae60;
            color: #fff;
        }
        .signup-form .buttons button.cancel {
            background-color: #e74c3c;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Sign Up</h2>
        <form class="signup-form">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first-name" placeholder="Enter First Name...">

            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last-name" placeholder="Enter Last Name...">

            <label for="screen-name">Screen Name</label>
            <input type="text" id="screen-name" name="screen-name" placeholder="Enter Screen Name...">

            <label for="dob">Date of Birth</label>
            <select id="dob-month" name="dob-month">
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May" selected>May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
            </select>
            <select id="dob-day" name="dob-day">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
                <option value="23">23</option>
                <option value="24">24</option>
                <option value="25">25</option>
                <option value="26">26</option>
                <option value="27">27</option>
                <option value="28">28</option>
                <option value="29">29</option>
                <option value="30">30</option>
                <option value="31">31</option>
            </select>
            <select id="dob-year" name="dob-year">
                <option value="2000">2000</option>
                <option value="1999">1999</option>
                <option value="1998">1998</option>
                <option value="1997">1997</option>
                <option value="1996">1996</option>
                <option value="1995">1995</option>
                <option value="1994">1994</option>
                <option value="1993">1993</option>
                <option value="1992">1992</option>
                <option value="1991">1991</option>
                <option value="1990">1990</option>
                <option value="1989">1989</option>
                <option value="1988">1988</option>
                <option value="1987">1987</option>
                <option value="1986">1986</option>
                <option value="1985" selected>1985</option>
                <option value="1984">1984</option>
                <option value="1983">1983</option>
                <option value="1982">1982</option>
                <option value="1981">1981</option>
                <option value="1980">1980</option>
                <option value="1979">1979</option>
                <option value="1978">1978</option>
                <option value="1977">1977</option>
                <option value="1976">1976</option>
                <option value="1975">1975</option>
                <option value="1974">1974</option>
                <option value="1973">1973</option>
                <option value="1972">1972</option>
                <option value="1971">1971</option>
                <option value="1970">1970</option>
            </select>

            <label for="gender">Gender</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <label for="country">Country</label>
            <select id="country" name="country">
                <option value="USA" selected>USA</option>
                <option value="Canada">Canada</option>
                <option value="UK">UK</option>
                <option value="Australia">Australia</option>
                <option value="India">India</option>
                <option value="Germany">Germany</option>
                <option value="France">France</option>
            </select>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Enter E-mail......">

            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter Phone......">

            <label for="password">Password</label>
            <input type="password" id="password" name="password">

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password">

            <div class="terms">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I agree to the Terms of Use</label>
            </div>

            <div class="buttons">
                <button type="submit" class="submit">Submit</button>
                <button type="button" class="cancel">Cancel</button>
            </div>
        </form>
    </div>
</body>
</html>
