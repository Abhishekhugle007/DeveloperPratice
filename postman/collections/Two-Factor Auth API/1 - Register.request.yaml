$kind: http-request
url: "{{baseUrl}}/v1/user/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \"name\":\"Coder AU\",\r

    \"email\":\"au@gmail.com\",\r

    \"password\":\"Password@123\"\r

    }\r\n"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201 - User Registered", () => {
          pm.response.to.have.status(201);
      });

      pm.test("Response has userId", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.nested.property("data.userId");
          pm.environment.set("userId", json.data.userId);
      });
    language: text/javascript
order: 1000
