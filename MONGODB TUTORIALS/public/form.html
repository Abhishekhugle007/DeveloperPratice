<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data</title>
</head>
<body>
    <h2>Student Data</h2>
    <form action="/add-student" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"  placeholder="Enter name" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"  placeholder="Enter age" required><br><br>

        <label for="grade">Course:</label>
        <input type="text" id="grade" name="Course" placeholder="Enter Course" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
