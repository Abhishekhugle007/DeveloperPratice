<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6fb">
    <title>Authentication and Authentication</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <main class="page">
        <section class="card" aria-labelledby="page-title">
            <p class="eyebrow">Auth App</p>
            <h1 id="page-title">Your account</h1>
            <p class="intro">Sign in or create an account to get started.</p>

            <div id="accountPanel" class="account-panel" hidden>
                <p id="accountMessage" role="status"></p>
                <div class="account-actions">
                    <button id="adminButton" class="button button-secondary" type="button">Check admin access</button>
                    <button id="logoutButton" class="button button-quiet" type="button">Sign out</button>
                </div>
            </div>

            <div id="authPanel">
                <div class="tabs" role="tablist" aria-label="Account action">
                    <button id="loginTab" class="tab active" type="button" role="tab" aria-selected="true">Sign in</button>
                    <button id="registerTab" class="tab" type="button" role="tab" aria-selected="false">Create account</button>
                </div>

                <form id="authForm">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>

                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>

                    <button id="submitButton" class="button button-primary" type="submit">Sign in</button>
                </form>
            </div>

            <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        </section>
        <p class="note">Your account is protected by server-side authentication.</p>
    </main>
</body>
</html>
