<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account sign in</title>
  <style>
    :root {
      font: 16px/1.5 system-ui, sans-serif;
      color: #172033;
      background: #f4f6fb;
    }

    body {
      max-width: 480px;
      margin: 48px auto;
      padding: 0 20px;
    }

    main {
      padding: 28px;
      background: white;
      border: 1px solid #dce2ed;
      border-radius: 12px;
      box-shadow: 0 8px 28px #17203312;
    }

    .company-logo {
      display: block;
      width: 180px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 24px;
    }

    h1 { margin-top: 0; }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }

    input {
      box-sizing: border-box;
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid #b8c2d3;
      border-radius: 6px;
      font: inherit;
    }

    button, .link-button {
      display: inline-block;
      margin: 18px 12px 0 0;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .link-button { background: transparent; color: #1d4ed8; padding-left: 0; }
    button:disabled { opacity: 0.6; cursor: wait; }
    [hidden] { display: none !important; }
    #status { min-height: 1.5em; overflow-wrap: anywhere; }
    #status.error { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <img class="company-logo" src="/images/company-logo.png" alt="ETech Global Services">
    <section id="login-panel">
      <h1>Sign in</h1>
      <form id="login-form">
        <label>Email
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Sign in</button>
        <button class="link-button" id="show-signup" type="button">Sign up</button>
        <button class="link-button" id="show-forgot" type="button">Forgot password?</button>
      </form>
    </section>

    <section id="signup-panel" hidden>
      <h1>Create account</h1>
      <form id="signup-form">
        <label>Name
          <input name="name" type="name" autocomplete="name" required>
        </label>
        <label>Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </label>
        <label>Confirm password
          <input name="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        </label>
        <button type="submit">Create account</button>
        <button class="link-button back-to-login" type="button">Back to sign in</button>
      </form>
    </section>

    <section id="email-verification-panel" hidden>
      <h1>Verify your email</h1>
      <p>Enter the 6-digit code sent to your email address.</p>
      <form id="email-verification-form">
        <input name="email" type="hidden">
        <label>Verification code
          <input name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
        </label>
        <button type="submit">Verify email</button>
        <button class="link-button" id="resend-verification" type="button">Resend code</button>
      </form>
      <button class="link-button back-to-login" type="button">Back to sign in</button>
    </section>

    <section id="forgot-panel" hidden>
      <h1>Reset password</h1>
      <form id="forgot-form">
        <label>Account email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <button type="submit">Send reset code</button>
        <button class="link-button back-to-login" type="button">Back to sign in</button>
      </form>
    </section>

    <section id="otp-panel" hidden>
      <h1>Verify reset code</h1>
      <form id="otp-form">
        <input name="email" type="hidden">
        <label>6-digit code
          <input name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
        </label>
        <button type="submit">Verify code</button>
      </form>
    </section>

    <section id="reset-panel" hidden>
      <h1>Choose a new password</h1>
      <form id="reset-form">
        <input name="email" type="hidden">
        <label>New password
          <input name="password" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <button type="submit">Change password</button>
      </form>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const panels = ['login', 'signup', 'email-verification', 'forgot', 'otp', 'reset'].reduce((result, name) => {
      result[name] = document.querySelector(`#${name}-panel`);
      return result;
    }, {});
    const status = document.querySelector('#status');
    let resetEmail = new URLSearchParams(location.search).get('email') || '';

    function showPanel(name) {
      Object.entries(panels).forEach(([key, panel]) => {
        panel.hidden = key !== name;
      });
      status.textContent = '';
      status.className = '';
    }

    async function submitForm(form, endpoint) {
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      status.textContent = 'Please wait…';
      status.className = '';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || 'The request failed.');
        }
        status.textContent = result.message || '';
        return result;
      } catch (error) {
        status.textContent = error.message;
        status.className = 'error';
        return null;
      } finally {
        button.disabled = false;
      }
    }

    document.querySelector('#show-forgot').addEventListener('click', () => showPanel('forgot'));
    document.querySelector('#show-signup').addEventListener('click', () => showPanel('signup'));
    document.querySelectorAll('.back-to-login').forEach((button) => {
      button.addEventListener('click', () => showPanel('login'));
    });

    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const result = await submitForm(event.currentTarget, '/login');
      if (result) location.assign('/dashboard');
    });

    document.querySelector('#signup-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const result = await submitForm(event.currentTarget, '/signup');
      if (result) {
        document.querySelector('#email-verification-form').elements.email.value = result.email;
        showPanel('email-verification');
        status.textContent = result.message;
      }
    });

    document.querySelector('#email-verification-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const result = await submitForm(event.currentTarget, '/verify-email');
      if (result) location.assign('/dashboard');
    });

    document.querySelector('#resend-verification').addEventListener('click', async (event) => {
      const form = document.querySelector('#email-verification-form');
      const button = event.currentTarget;
      button.disabled = true;
      status.textContent = 'Please wait…';
      status.className = '';

      try {
        const response = await fetch('/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.elements.email.value }),
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || 'The request failed.');
        }
        status.textContent = result.message;
      } catch (error) {
        status.textContent = error.message;
        status.className = 'error';
      } finally {
        button.disabled = false;
      }
    });

    document.querySelector('#forgot-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const result = await submitForm(form, '/forgot-password');
      if (result) {
        resetEmail = form.elements.email.value.trim();
        document.querySelector('#otp-form').elements.email.value = resetEmail;
        showPanel('otp');
        status.textContent = result.message;
      }
    });

    document.querySelector('#otp-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const result = await submitForm(event.currentTarget, '/verify-otp');
      if (result) {
        document.querySelector('#reset-form').elements.email.value = resetEmail;
        showPanel('reset');
        status.textContent = result.message;
      }
    });

    document.querySelector('#reset-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const result = await submitForm(event.currentTarget, '/reset-password');
      if (result) {
        showPanel('login');
        status.textContent = result.message;
      }
    });

    if (resetEmail) {
      document.querySelector('#forgot-form').elements.email.value = resetEmail;
      document.querySelector('#otp-form').elements.email.value = resetEmail;
      showPanel('otp');
    }
  </script>
</body>
</html>
